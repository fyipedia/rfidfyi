[project]
name = "rfidfyi"
version = "0.1.0"
description = "RFID tag and frequency band encyclopedia API client — look up passive, active, and semi-passive tags, EPC Gen2, ISO 18000 standards, and read range specifications from RFIDFYI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "FYIPedia" }]
keywords = [
    "rfid",
    "epc",
    "epc-gen2",
    "frequency-band",
    "uhf",
    "nfc",
    "iso-18000",
    "passive-tag",
    "api-client",
    "reference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
api = ["httpx>=0.27"]
cli = ["typer>=0.15", "rich>=13.0"]
mcp = ["mcp>=1.0"]
all = ["rfidfyi[api,cli,mcp]"]

[project.scripts]
rfidfyi = "rfidfyi.cli:app"

[project.entry-points."mcp.servers"]
rfidfyi = "rfidfyi.mcp_server:mcp"

[project.urls]
Homepage = "https://rfidfyi.com"
"Tag Explorer" = "https://rfidfyi.com/tag/"
"Standards Reference" = "https://rfidfyi.com/standard/"
Documentation = "https://rfidfyi.com/developers/"
Repository = "https://github.com/fyipedia/rfidfyi"
Issues = "https://github.com/fyipedia/rfidfyi/issues"
Changelog = "https://github.com/fyipedia/rfidfyi/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfidfyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mcp>=1.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "rich>=13.0",
    "ruff>=0.15.4",
    "typer>=0.15",
]
